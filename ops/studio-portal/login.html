<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Base de datos — La Carolina</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 55%, #312e81 100%);
      padding: 24px;
    }
    .card {
      width: 100%;
      max-width: 380px;
      background: rgba(255, 255, 255, 0.97);
      border-radius: 18px;
      padding: 40px 34px 34px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    }
    .logo {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      display: grid; place-items: center;
      margin: 0 auto 18px;
      color: #fff; font-size: 24px;
    }
    h1 { font-size: 20px; text-align: center; color: #0f172a; letter-spacing: -0.02em; }
    p.sub { text-align: center; color: #64748b; font-size: 13.5px; margin: 6px 0 26px; }
    label { display: block; font-size: 12.5px; font-weight: 600; color: #475569; margin: 0 0 6px 2px; }
    input {
      width: 100%; height: 44px;
      border: 1.5px solid #e2e8f0; border-radius: 10px;
      padding: 0 14px; font-size: 15px; color: #0f172a;
      outline: none; transition: border-color 0.15s, box-shadow 0.15s;
      margin-bottom: 16px; background: #fff;
    }
    input:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15); }
    button {
      width: 100%; height: 46px;
      border: 0; border-radius: 10px;
      background: linear-gradient(135deg, #4f46e5, #6d28d9);
      color: #fff; font-size: 15px; font-weight: 600;
      cursor: pointer; margin-top: 6px;
      transition: filter 0.15s, transform 0.05s;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(0.99); }
    .error {
      background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c;
      font-size: 13px; border-radius: 10px; padding: 10px 12px; margin-bottom: 16px;
      text-align: center;
    }
    .error:empty { display: none; }
    footer { margin-top: 22px; text-align: center; color: #94a3b8; font-size: 12px; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/portal/entrar" autocomplete="off">
    <div class="logo">⛁</div>
    <h1>Base de datos Gestivo</h1>
    <p class="sub">Acceso restringido al equipo autorizado</p>
    <div class="error">{{ERROR}}</div>
    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" type="text" required autofocus autocapitalize="none" />
    <label for="clave">Contraseña</label>
    <input id="clave" name="clave" type="password" required />
    <button type="submit">Ingresar</button>
    <footer>La Carolina · Supabase Studio</footer>
  </form>
</body>
</html>
